name: renovate

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

jobs:
  renovate:
    runs-on: docker
    container:
      image: renovate/renovate:44
    steps:
      - name: Run Renovate
        env:
          RENOVATE_PLATFORM: gitea
          RENOVATE_ENDPOINT: https://forgejo.eborn.me/api/v1/
          RENOVATE_TOKEN: ${{ secrets.RENOVATE_TOKEN }}
          RENOVATE_GIT_AUTHOR: "Renovate <renovate@eborn.me>"
          LOG_LEVEL: info
        run: renovate djeborn/ledup
