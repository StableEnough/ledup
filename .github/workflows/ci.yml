name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends nodejs dbus
      - run: uv sync --locked --group dev
      - run: uv run ruff check .
      - run: uv run ty check
      - run: uv run python -m unittest discover -s tests -v
