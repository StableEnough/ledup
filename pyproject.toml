[project]
name = "ledup-control"
version = "0.1.0"
description = "Local BLE advertising control for LEDUP lights"
# dbus-next 0.2.3 (unmaintained) imports typing.no_type_check_decorator, removed in 3.15; lift after moving to dbus-fast.
requires-python = ">=3.14,<3.15"
dependencies = ["dbus-next==0.2.3"]

[dependency-groups]
dev = [
    "unicorn>=2.1.4",
    "pyelftools>=0.32",
    "ruff>=0.16",
    "ty>=0.0.95",
]

[tool.uv]
package = false

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = [
    "E501",   # long lines are intentional (error table, docs)
    "F821",   # dbus-next annotations are D-Bus signatures ('s', 'u', 'b'), not types
    "F722",
    "UP037",  # same: quotes around signature annotations must stay
]

[tool.ty.src]
# tests deliberately pass invalid types and poke dbus-next mocks
include = ["ledup.py", "tools"]
