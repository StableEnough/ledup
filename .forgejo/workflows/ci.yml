name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: docker
    container:
      image: ghcr.io/astral-sh/uv:python3.14-bookworm
    steps:
      - run: apt-get update && apt-get install -y --no-install-recommends nodejs dbus
      - uses: actions/checkout@v4
      - run: uv sync --locked
      - run: uv run python -m unittest discover -s tests -v
